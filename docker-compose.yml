version: '3.8'

# ─── Internal network — infra ports are NOT exposed to the host ───────────────
# See docker-compose.override.yml to expose ports for local development.
networks:
  internal:
    driver: bridge

services:
  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-gamesmith}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: gamesmith_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.12.1
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ai-service:
    image: ${DOCKERHUB_USERNAME:-gamesmith}/gamesmith-ai-service:${IMAGE_TAG:-latest}
    build:
      context: ./ai-service
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: game_assets
      EMBEDDING_MODEL: paraphrase-multilingual-MiniLM-L12-v2
      BACKEND_URL: http://backend:3000
      HF_HOME: /app/hf_cache
    networks:
      - internal
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    image: ${DOCKERHUB_USERNAME:-gamesmith}/gamesmith-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_USERNAME:-gamesmith}:${MONGO_PASSWORD:-changeme}@mongodb:27017/gamesmith_db?authSource=admin
      AI_SERVICE_URL: http://ai-service:8000
      BACKEND_URL: http://backend:3000
      # Allow requests from the VPS public domain / local dev origins
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:5173,http://localhost:4173}
    volumes:
      - uploads_data:/usr/src/app/uploads
    networks:
      - internal
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null 'http://localhost:3000/assets/featured?limit=1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ${DOCKERHUB_USERNAME:-gamesmith}/gamesmith-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        # On VPS: set VITE_API_URL=http://YOUR_VPS_IP in root .env
        # Frontend calls /users, /assets etc — nginx proxies them to backend
        VITE_API_URL: ${VITE_API_URL:-http://localhost}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:
  qdrant_data:
  uploads_data:
