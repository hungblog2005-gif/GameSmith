server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ── Gzip compression ─────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json image/svg+xml;

  # ── Security headers ─────────────────────────────────────────────────────
  add_header X-Frame-Options           "SAMEORIGIN"          always;
  add_header X-Content-Type-Options    "nosniff"             always;
  add_header X-XSS-Protection          "1; mode=block"       always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

  # ── Health check endpoint (used by Docker HEALTHCHECK) ───────────────────
  location /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # ── Static assets — long cache TTL ───────────────────────────────────────
  location ~* \.(?:js|css|woff2?|ttf|svg|ico|png|jpg|jpeg|gif|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri $uri/ @backend;
  }

  # ── WebSocket (Socket.IO) — must be before the API regex ─────────────────
  location /socket.io/ {
    proxy_pass         http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
  }

  # ── All backend API routes + uploads (no /api/ prefix needed) ────────────
  location ~ ^/(users|assets|categories|recommendations|wishlists|carts|admin|orders|payments|reviews|profiles|messages|transactions|user-collections|ratings|downloads|uploads|ratings)/ {
    proxy_pass         http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # Allow large file uploads (thumbnails, payment proofs)
    client_max_body_size 10m;
  }

  # ── SPA fallback — serves React index.html for all frontend routes ────────
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ── Named location for proxying non-API static asset misses ──────────────
  location @backend {
    proxy_pass         http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}
