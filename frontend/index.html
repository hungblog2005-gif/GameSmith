<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameSmith – Premium Game Assets Marketplace</title>
    <meta name="description" content="GameSmith is a premium marketplace for high-quality game assets. Browse 3D models, textures, audio, UI kits, VFX, and more for your game projects." />
    <meta name="robots" content="index, follow" />

    <!-- Preconnect for faster resource loading -->
    <link rel="preconnect" href="http://localhost:3000" />
    <link rel="dns-prefetch" href="http://localhost:3000" />

    <!-- Open Graph fallback (per-page OG handled by react-helmet-async) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GameSmith" />
    <meta property="og:title" content="GameSmith – Premium Game Assets Marketplace" />
    <meta property="og:description" content="GameSmith is a premium marketplace for high-quality game assets. Browse 3D models, textures, audio, UI kits, and more." />
    <meta property="og:image" content="/assets/logo.png" />

    <!-- Twitter Card fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GameSmith – Premium Game Assets Marketplace" />
    <meta name="twitter:description" content="Premium game assets marketplace. 3D models, textures, audio, and more." />
    <meta name="twitter:image" content="/assets/logo.png" />

    <!-- Prevent theme flash -->
    <script>
      const theme = localStorage.getItem("theme")
      if (
        theme === "dark" ||
        (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark")
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
